<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkillMatrix | Enterprise Developer & Bench Allocation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <!-- React & Babel from CDN for standalone 1-click execution -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root {
      --bg-primary: #0a0f1d;
      --bg-secondary: #111827;
      --bg-card: rgba(17, 24, 39, 0.85);
      --border-color: rgba(255, 255, 255, 0.08);
      --border-focus: rgba(99, 102, 241, 0.5);
      --text-primary: #f9fafb;
      --text-secondary: #9ca3af;
      --text-muted: #6b7280;
      --accent-primary: #6366f1;
      --accent-hover: #4f46e5;
      --accent-glow: rgba(99, 102, 241, 0.25);
      --status-available-bg: rgba(16, 185, 129, 0.12);
      --status-available-text: #34d399;
      --status-available-border: rgba(16, 185, 129, 0.3);
      --status-allocated-bg: rgba(59, 130, 246, 0.12);
      --status-allocated-text: #60a5fa;
      --status-allocated-border: rgba(59, 130, 246, 0.3);
      --danger-bg: rgba(239, 68, 68, 0.12);
      --danger-text: #f87171;
      --danger-border: rgba(239, 68, 68, 0.3);
      --tag-bg: rgba(255, 255, 255, 0.05);
      --tag-border: rgba(255, 255, 255, 0.1);
      --tag-text: #e5e7eb;
      --font-main: 'Plus Jakarta Sans', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --shadow-card: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-main);
      background-color: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      background-image: 
        radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.08) 0px, transparent 50%),
        radial-gradient(at 100% 0%, rgba(16, 185, 129, 0.05) 0px, transparent 50%),
        radial-gradient(at 50% 100%, rgba(59, 130, 246, 0.05) 0px, transparent 50%);
      background-attachment: fixed;
    }
    .app-container { max-width: 1320px; margin: 0 auto; padding: 24px 20px 60px; }
    .navbar { display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; background: var(--bg-card); backdrop-filter: blur(12px); border: 1px solid var(--border-color); border-radius: var(--radius-lg); margin-bottom: 28px; }
    .brand-section { display: flex; align-items: center; gap: 14px; }
    .brand-icon { width: 42px; height: 42px; background: linear-gradient(135deg, #6366f1, #3b82f6); border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; color: white; box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4); }
    .brand-title { font-size: 1.25rem; font-weight: 800; background: linear-gradient(to right, #ffffff, #c7d2fe); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .brand-subtitle { font-size: 0.8rem; color: var(--text-muted); font-weight: 500; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 18px; font-size: 0.875rem; font-weight: 600; border-radius: var(--radius-md); border: none; cursor: pointer; transition: all 0.2s; }
    .btn-primary { background: linear-gradient(135deg, #6366f1, #4f46e5); color: white; box-shadow: 0 4px 12px rgba(99, 102, 241, 0.35); }
    .btn-primary:hover { background: linear-gradient(135deg, #4f46e5, #4338ca); transform: translateY(-1px); }
    .btn-secondary { background: rgba(255, 255, 255, 0.06); color: var(--text-primary); border: 1px solid var(--border-color); }
    .btn-success { background: var(--status-available-bg); color: var(--status-available-text); border: 1px solid var(--status-available-border); }
    .btn-allocate { background: var(--status-allocated-bg); color: var(--status-allocated-text); border: 1px solid var(--status-allocated-border); }
    .btn-danger { background: var(--danger-bg); color: var(--danger-text); border: 1px solid var(--danger-border); }
    .btn-sm { padding: 6px 12px; font-size: 0.8rem; border-radius: var(--radius-sm); }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin-bottom: 28px; }
    .stat-card { background: var(--bg-card); backdrop-filter: blur(8px); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 20px; display: flex; align-items: center; gap: 16px; }
    .stat-icon-wrapper { width: 48px; height: 48px; border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; }
    .icon-purple { background: rgba(99, 102, 241, 0.15); color: #818cf8; }
    .icon-green { background: rgba(16, 185, 129, 0.15); color: #34d399; }
    .icon-blue { background: rgba(59, 130, 246, 0.15); color: #60a5fa; }
    .icon-amber { background: rgba(245, 158, 11, 0.15); color: #fbbf24; }
    .stat-label { font-size: 0.8rem; color: var(--text-secondary); font-weight: 500; text-transform: uppercase; }
    .stat-value { font-size: 1.6rem; font-weight: 800; color: var(--text-primary); }
    .filter-container { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 16px 20px; margin-bottom: 24px; display: flex; flex-direction: column; gap: 14px; }
    .filter-top { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
    .search-box { position: relative; flex: 1; min-width: 280px; }
    .search-input { width: 100%; padding: 10px 14px 10px 42px; background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: var(--radius-md); color: var(--text-primary); font-size: 0.9rem; }
    .search-input:focus { outline: none; border-color: var(--accent-primary); box-shadow: 0 0 0 3px var(--accent-glow); }
    .filter-select { padding: 10px 16px; background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: var(--radius-md); color: var(--text-primary); font-size: 0.9rem; }
    .skill-chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .skill-chip { padding: 4px 12px; background: var(--tag-bg); border: 1px solid var(--tag-border); border-radius: 20px; font-size: 0.78rem; color: var(--tag-text); cursor: pointer; }
    .skill-chip.active { background: var(--accent-primary); color: white; border-color: var(--accent-primary); }
    .dev-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 20px; }
    .dev-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 22px; display: flex; flex-direction: column; justify-content: space-between; box-shadow: var(--shadow-card); }
    .dev-header { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 16px; }
    .dev-avatar { width: 52px; height: 52px; border-radius: var(--radius-md); background: var(--bg-secondary); border: 1px solid var(--border-color); padding: 4px; }
    .dev-name { font-size: 1.05rem; font-weight: 700; color: var(--text-primary); }
    .dev-role { font-size: 0.85rem; color: #818cf8; font-weight: 500; margin-bottom: 4px; }
    .dev-email { font-size: 0.78rem; color: var(--text-muted); }
    .badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 20px; font-size: 0.72rem; font-weight: 600; text-transform: uppercase; }
    .badge-available { background: var(--status-available-bg); color: var(--status-available-text); border: 1px solid var(--status-available-border); }
    .badge-allocated { background: var(--status-allocated-bg); color: var(--status-allocated-text); border: 1px solid var(--status-allocated-border); }
    .badge-dot { width: 6px; height: 6px; border-radius: 50%; background-color: currentColor; }
    .dev-meta { display: flex; gap: 12px; padding: 12px 0; border-top: 1px solid var(--border-color); border-bottom: 1px solid var(--border-color); margin-bottom: 14px; font-size: 0.8rem; color: var(--text-secondary); }
    .current-project-box { background: rgba(59, 130, 246, 0.08); border: 1px dashed rgba(59, 130, 246, 0.3); padding: 8px 12px; border-radius: var(--radius-sm); margin-bottom: 14px; font-size: 0.8rem; color: #93c5fd; }
    .skills-label { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 6px; font-weight: 600; text-transform: uppercase; }
    .skill-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
    .skill-tag { background: var(--tag-bg); border: 1px solid var(--tag-border); color: var(--tag-text); font-size: 0.75rem; padding: 3px 9px; border-radius: var(--radius-sm); font-family: var(--font-mono); }
    .dev-actions { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; z-index: 999; padding: 20px; }
    .modal-card { background: #111827; border: 1px solid rgba(255, 255, 255, 0.12); border-radius: var(--radius-lg); width: 100%; max-width: 520px; padding: 26px; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .form-group { margin-bottom: 16px; }
    .form-label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: var(--text-secondary); }
    .form-control { width: 100%; padding: 10px 14px; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: var(--radius-md); color: var(--text-primary); font-size: 0.9rem; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .form-actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px; }
    .toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 1000; display: flex; flex-direction: column; gap: 8px; }
    .toast { background: #1f2937; color: white; padding: 12px 18px; border-radius: var(--radius-md); border-left: 4px solid var(--accent-primary); box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4); font-size: 0.875rem; }
    .toast.success { border-left-color: #10b981; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const INITIAL_DEVS = [
      {
        id: 1,
        name: "Aarav Patel",
        email: "aarav.patel@cognizant.com",
        role: "Senior Java Microservices Engineer",
        experienceLevel: "SENIOR",
        yearsOfExperience: 6,
        skills: ["Java", "Spring Boot", "Microservices", "Kafka", "Docker", "PostgreSQL"],
        status: "AVAILABLE",
        currentProject: null,
        location: "Bangalore, India",
        avatarUrl: "https://api.dicebear.com/7.x/bottts/svg?seed=Aarav"
      },
      {
        id: 2,
        name: "Priya Sharma",
        email: "priya.sharma@cognizant.com",
        role: "Full Stack React & Spring Developer",
        experienceLevel: "MID_LEVEL",
        yearsOfExperience: 4,
        skills: ["React", "Java", "Spring Boot", "TypeScript", "Tailwind CSS", "REST API"],
        status: "ALLOCATED",
        currentProject: "HSBC Global Banking Modernization",
        location: "Hyderabad, India",
        avatarUrl: "https://api.dicebear.com/7.x/bottts/svg?seed=Priya"
      },
      {
        id: 3,
        name: "Rohan Kulkarni",
        email: "rohan.k@cognizant.com",
        role: "Lead Cloud Solutions Architect",
        experienceLevel: "TECH_LEAD",
        yearsOfExperience: 10,
        skills: ["AWS", "Kubernetes", "Spring Cloud", "Terraform", "Java", "CI/CD"],
        status: "ALLOCATED",
        currentProject: "JPMorgan Cloud Migration",
        location: "Pune, India",
        avatarUrl: "https://api.dicebear.com/7.x/bottts/svg?seed=Rohan"
      },
      {
        id: 4,
        name: "Ananya Iyer",
        email: "ananya.iyer@cognizant.com",
        role: "Junior Frontend UI/UX Engineer",
        experienceLevel: "JUNIOR",
        yearsOfExperience: 2,
        skills: ["React", "JavaScript", "HTML5", "CSS3", "Redux", "Figma"],
        status: "AVAILABLE",
        currentProject: null,
        location: "Chennai, India",
        avatarUrl: "https://api.dicebear.com/7.x/bottts/svg?seed=Ananya"
      },
      {
        id: 5,
        name: "Vikram Singh",
        email: "vikram.singh@cognizant.com",
        role: "DevOps & Site Reliability Engineer",
        experienceLevel: "SENIOR",
        yearsOfExperience: 7,
        skills: ["Docker", "Kubernetes", "Jenkins", "AWS", "Linux", "Prometheus"],
        status: "AVAILABLE",
        currentProject: null,
        location: "Bangalore, India",
        avatarUrl: "https://api.dicebear.com/7.x/bottts/svg?seed=Vikram"
      },
      {
        id: 6,
        name: "Sneha Reddy",
        email: "sneha.reddy@cognizant.com",
        role: "Backend Java API Developer",
        experienceLevel: "MID_LEVEL",
        yearsOfExperience: 3,
        skills: ["Java", "Spring Boot", "Hibernate", "MySQL", "JUnit", "Swagger"],
        status: "AVAILABLE",
        currentProject: null,
        location: "Hyderabad, India",
        avatarUrl: "https://api.dicebear.com/7.x/bottts/svg?seed=Sneha"
      },
      {
        id: 7,
        name: "Aditya Verma",
        email: "aditya.verma@cognizant.com",
        role: "Data & AI Integration Specialist",
        experienceLevel: "MID_LEVEL",
        yearsOfExperience: 5,
        skills: ["Python", "Java", "FastAPI", "PostgreSQL", "OpenAI API", "Docker"],
        status: "ALLOCATED",
        currentProject: "Aetna Healthcare AI Claims",
        location: "Noida, India",
        avatarUrl: "https://api.dicebear.com/7.x/bottts/svg?seed=Aditya"
      }
    ];

    const POPULAR_SKILLS = ['Java', 'Spring Boot', 'React', 'Microservices', 'Docker', 'AWS', 'Kubernetes', 'TypeScript', 'PostgreSQL'];

    function App() {
      const [developers, setDevelopers] = useState(INITIAL_DEVS);
      const [search, setSearch] = useState('');
      const [statusFilter, setStatusFilter] = useState('');
      const [selectedSkill, setSelectedSkill] = useState('');
      const [isDevModalOpen, setIsDevModalOpen] = useState(false);
      const [editingDev, setEditingDev] = useState(null);
      const [isAllocateModalOpen, setIsAllocateModalOpen] = useState(false);
      const [allocatingDev, setAllocatingDev] = useState(null);
      const [allocateProject, setAllocateProject] = useState('HSBC Global Banking');
      const [toast, setToast] = useState('');

      // Form state
      const [formData, setFormData] = useState({
        name: '', email: '', role: '', experienceLevel: 'MID_LEVEL', yearsOfExperience: 3, location: 'Bangalore, India', skillsInput: ''
      });

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(''), 3500);
      };

      // Filtered developers
      const filteredDevs = useMemo(() => {
        return developers.filter(dev => {
          const matchesSearch = !search || 
            dev.name.toLowerCase().includes(search.toLowerCase()) ||
            dev.role.toLowerCase().includes(search.toLowerCase()) ||
            dev.location.toLowerCase().includes(search.toLowerCase()) ||
            dev.skills.some(s => s.toLowerCase().includes(search.toLowerCase()));

          const matchesStatus = !statusFilter || dev.status === statusFilter;
          const matchesSkill = !selectedSkill || dev.skills.some(s => s.toLowerCase() === selectedSkill.toLowerCase());

          return matchesSearch && matchesStatus && matchesSkill;
        });
      }, [developers, search, statusFilter, selectedSkill]);

      // Metrics
      const totalDevs = developers.length;
      const availableDevs = developers.filter(d => d.status === 'AVAILABLE').length;
      const allocatedDevs = developers.filter(d => d.status === 'ALLOCATED').length;
      const benchRate = totalDevs > 0 ? Math.round((availableDevs / totalDevs) * 100) : 0;

      const handleOpenAdd = () => {
        setEditingDev(null);
        setFormData({
          name: '', email: '', role: '', experienceLevel: 'MID_LEVEL', yearsOfExperience: 3, location: 'Bangalore, India', skillsInput: 'Java, Spring Boot, React'
        });
        setIsDevModalOpen(true);
      };

      const handleOpenEdit = (dev) => {
        setEditingDev(dev);
        setFormData({
          name: dev.name,
          email: dev.email,
          role: dev.role,
          experienceLevel: dev.experienceLevel,
          yearsOfExperience: dev.yearsOfExperience,
          location: dev.location,
          skillsInput: dev.skills.join(', ')
        });
        setIsDevModalOpen(true);
      };

      const handleSaveDev = (e) => {
        e.preventDefault();
        const skillsArr = formData.skillsInput.split(',').map(s => s.trim()).filter(Boolean);
        
        if (editingDev) {
          setDevelopers(prev => prev.map(d => d.id === editingDev.id ? {
            ...d,
            ...formData,
            skills: skillsArr
          } : d));
          showToast(`Updated profile for ${formData.name}!`);
        } else {
          const newDev = {
            id: Date.now(),
            ...formData,
            skills: skillsArr,
            status: 'AVAILABLE',
            currentProject: null,
            avatarUrl: `https://api.dicebear.com/7.x/bottts/svg?seed=${formData.name.replace(/\\s+/g, '')}`
          };
          setDevelopers(prev => [newDev, ...prev]);
          showToast(`Added ${formData.name} to SkillMatrix!`);
        }
        setIsDevModalOpen(false);
      };

      const handleAllocate = (e) => {
        e.preventDefault();
        if (!allocatingDev) return;
        setDevelopers(prev => prev.map(d => d.id === allocatingDev.id ? {
          ...d,
          status: 'ALLOCATED',
          currentProject: allocateProject
        } : d));
        showToast(`Allocated ${allocatingDev.name} to ${allocateProject}!`);
        setIsAllocateModalOpen(false);
      };

      const handleRelease = (id) => {
        setDevelopers(prev => prev.map(d => d.id === id ? {
          ...d,
          status: 'AVAILABLE',
          currentProject: null
        } : d));
        showToast("Engineer released back to Bench (Available).");
      };

      const handleDelete = (id, name) => {
        if (confirm(`Remove ${name} from SkillMatrix?`)) {
          setDevelopers(prev => prev.filter(d => d.id !== id));
          showToast(`Removed ${name}.`);
        }
      };

      return (
        <div className="app-container">
          <header className="navbar">
            <div className="brand-section">
              <div className="brand-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5">
                  <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                  <polyline points="2 17 12 22 22 17"></polyline>
                  <polyline points="2 12 12 17 22 12"></polyline>
                </svg>
              </div>
              <div>
                <h1 className="brand-title">SkillMatrix</h1>
                <p className="brand-subtitle">Cognizant Developer Talent &amp; Bench Allocation Hub</p>
              </div>
            </div>
            <button className="btn btn-primary" onClick={handleOpenAdd}>
              + Add Developer
            </button>
          </header>

          {/* Stats */}
          <div className="stats-grid">
            <div className="stat-card">
              <div className="stat-icon-wrapper icon-purple">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle></svg>
              </div>
              <div>
                <div className="stat-label">Total Engineers</div>
                <div className="stat-value">{totalDevs}</div>
              </div>
            </div>
            <div className="stat-card">
              <div className="stat-icon-wrapper icon-green">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 14 14"></polyline></svg>
              </div>
              <div>
                <div className="stat-label">Bench Available</div>
                <div className="stat-value">{availableDevs}</div>
              </div>
            </div>
            <div className="stat-card">
              <div className="stat-icon-wrapper icon-blue">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
              </div>
              <div>
                <div className="stat-label">Allocated to Client</div>
                <div className="stat-value">{allocatedDevs}</div>
              </div>
            </div>
            <div className="stat-card">
              <div className="stat-icon-wrapper icon-amber">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line></svg>
              </div>
              <div>
                <div className="stat-label">Bench Rate</div>
                <div className="stat-value">{benchRate}%</div>
              </div>
            </div>
          </div>

          {/* Filter Bar */}
          <div className="filter-container">
            <div className="filter-top">
              <div className="search-box">
                <input
                  type="text"
                  className="search-input"
                  placeholder="🔍 Search engineer, role, skill (e.g. 'Java', 'React', 'AWS')..."
                  value={search}
                  onChange={(e) => setSearch(e.target.value)}
                />
              </div>
              <select
                className="filter-select"
                value={statusFilter}
                onChange={(e) => setStatusFilter(e.target.value)}
              >
                <option value="">All Allocation Statuses</option>
                <option value="AVAILABLE">🟢 Available on Bench</option>
                <option value="ALLOCATED">🔵 Allocated to Project</option>
              </select>
            </div>

            <div className="skill-chips">
              <span style={{ fontSize: '0.75rem', color: 'var(--text-muted)', fontWeight: 600 }}>QUICK FILTER:</span>
              <button className={`skill-chip ${!selectedSkill ? 'active' : ''}`} onClick={() => setSelectedSkill('')}>
                All Skills
              </button>
              {POPULAR_SKILLS.map(skill => (
                <button
                  key={skill}
                  className={`skill-chip ${selectedSkill === skill ? 'active' : ''}`}
                  onClick={() => setSelectedSkill(selectedSkill === skill ? '' : skill)}
                >
                  {skill}
                </button>
              ))}
            </div>
          </div>

          {/* Cards Grid */}
          <div className="dev-grid">
            {filteredDevs.map(dev => {
              const isAvail = dev.status === 'AVAILABLE';
              return (
                <div key={dev.id} className="dev-card">
                  <div>
                    <div className="dev-header">
                      <img src={dev.avatarUrl} alt={dev.name} className="dev-avatar" />
                      <div style={{ flex: 1 }}>
                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                          <h3 className="dev-name">{dev.name}</h3>
                          <span className={`badge ${isAvail ? 'badge-available' : 'badge-allocated'}`}>
                            <span className="badge-dot"></span>
                            {isAvail ? 'On Bench' : 'Allocated'}
                          </span>
                        </div>
                        <p className="dev-role">{dev.role}</p>
                        <p className="dev-email">✉ {dev.email}</p>
                      </div>
                    </div>

                    <div className="dev-meta">
                      <span>💼 {dev.experienceLevel} ({dev.yearsOfExperience} yrs)</span>
                      <span>📍 {dev.location}</span>
                    </div>

                    {!isAvail && dev.currentProject && (
                      <div className="current-project-box">
                        📁 <strong>Project:</strong> {dev.currentProject}
                      </div>
                    )}

                    <div>
                      <div className="skills-label">Technical Stack</div>
                      <div className="skill-tags">
                        {dev.skills.map((s, i) => (
                          <span key={i} className="skill-tag">{s}</span>
                        ))}
                      </div>
                    </div>
                  </div>

                  <div className="dev-actions">
                    {isAvail ? (
                      <button
                        className="btn btn-allocate btn-sm"
                        onClick={() => {
                          setAllocatingDev(dev);
                          setIsAllocateModalOpen(true);
                        }}
                      >
                        + Assign Project
                      </button>
                    ) : (
                      <button
                        className="btn btn-success btn-sm"
                        onClick={() => handleRelease(dev.id)}
                      >
                        ✓ Release to Bench
                      </button>
                    )}

                    <div style={{ display: 'flex', gap: '6px' }}>
                      <button className="btn btn-secondary btn-sm" onClick={() => handleOpenEdit(dev)}>
                        Edit
                      </button>
                      <button className="btn btn-danger btn-sm" onClick={() => handleDelete(dev.id, dev.name)}>
                        Delete
                      </button>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>

          {/* Add/Edit Modal */}
          {isDevModalOpen && (
            <div className="modal-overlay" onClick={() => setIsDevModalOpen(false)}>
              <div className="modal-card" onClick={e => e.stopPropagation()}>
                <div className="modal-header">
                  <h2>{editingDev ? 'Edit Developer' : 'Add New Developer'}</h2>
                  <button className="btn btn-secondary btn-sm" onClick={() => setIsDevModalOpen(false)}>✕</button>
                </div>
                <form onSubmit={handleSaveDev}>
                  <div className="form-group">
                    <label className="form-label">Full Name</label>
                    <input
                      type="text"
                      className="form-control"
                      value={formData.name}
                      onChange={e => setFormData({ ...formData, name: e.target.value })}
                      required
                    />
                  </div>
                  <div className="form-group">
                    <label className="form-label">Cognizant Email</label>
                    <input
                      type="email"
                      className="form-control"
                      value={formData.email}
                      onChange={e => setFormData({ ...formData, email: e.target.value })}
                      required
                    />
                  </div>
                  <div className="form-group">
                    <label className="form-label">Role</label>
                    <input
                      type="text"
                      className="form-control"
                      value={formData.role}
                      onChange={e => setFormData({ ...formData, role: e.target.value })}
                      required
                    />
                  </div>
                  <div className="form-row">
                    <div className="form-group">
                      <label className="form-label">Level</label>
                      <select
                        className="form-control"
                        value={formData.experienceLevel}
                        onChange={e => setFormData({ ...formData, experienceLevel: e.target.value })}
                      >
                        <option value="JUNIOR">JUNIOR</option>
                        <option value="MID_LEVEL">MID_LEVEL</option>
                        <option value="SENIOR">SENIOR</option>
                        <option value="TECH_LEAD">TECH_LEAD</option>
                      </select>
                    </div>
                    <div className="form-group">
                      <label className="form-label">Experience (Years)</label>
                      <input
                        type="number"
                        className="form-control"
                        value={formData.yearsOfExperience}
                        onChange={e => setFormData({ ...formData, yearsOfExperience: e.target.value })}
                        required
                      />
                    </div>
                  </div>
                  <div className="form-group">
                    <label className="form-label">Skills (Comma-separated)</label>
                    <input
                      type="text"
                      className="form-control"
                      placeholder="Java, Spring Boot, React, Docker"
                      value={formData.skillsInput}
                      onChange={e => setFormData({ ...formData, skillsInput: e.target.value })}
                      required
                    />
                  </div>
                  <div className="form-actions">
                    <button type="button" className="btn btn-secondary" onClick={() => setIsDevModalOpen(false)}>Cancel</button>
                    <button type="submit" className="btn btn-primary">Save Profile</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Allocate Modal */}
          {isAllocateModalOpen && (
            <div className="modal-overlay" onClick={() => setIsAllocateModalOpen(false)}>
              <div className="modal-card" style={{ maxWidth: '440px' }} onClick={e => e.stopPropagation()}>
                <div className="modal-header">
                  <h2>Allocate to Project</h2>
                  <button className="btn btn-secondary btn-sm" onClick={() => setIsAllocateModalOpen(false)}>✕</button>
                </div>
                <p style={{ fontSize: '0.85rem', color: 'var(--text-secondary)', marginBottom: '14px' }}>
                  Assigning <strong>{allocatingDev?.name}</strong> to client project.
                </p>
                <form onSubmit={handleAllocate}>
                  <div className="form-group">
                    <label className="form-label">Project Name</label>
                    <input
                      type="text"
                      className="form-control"
                      value={allocateProject}
                      onChange={e => setAllocateProject(e.target.value)}
                      required
                    />
                  </div>
                  <div className="form-actions">
                    <button type="button" className="btn btn-secondary" onClick={() => setIsAllocateModalOpen(false)}>Cancel</button>
                    <button type="submit" className="btn btn-primary">Confirm Allocation</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Toast */}
          {toast && (
            <div className="toast-container">
              <div className="toast success">{toast}</div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
